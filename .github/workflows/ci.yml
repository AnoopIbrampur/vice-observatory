name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Python ${{ matrix.python }} / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Python fault-injection and analysis tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard syntax and integrity tests
        run: |
          node --check dist/app.mjs
          node --check dist/model.mjs
          node --check dist/investigation.mjs
          node --test tests/dashboard.test.mjs
      - name: Offline release gate
        run: python -m scripts.check_release
      - name: Static assets and downloads over loopback HTTP
        run: python -m scripts.smoke_http
