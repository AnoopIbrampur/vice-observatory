name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Python ${{ matrix.python }} / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Python fault-injection and analysis tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard syntax and integrity tests
        run: |
          node --check dist/app.mjs
          node --check dist/model.mjs
          node --test tests/dashboard.test.mjs
      - name: Offline release gate
        run: python -m scripts.check_release
      - name: Static assets and downloads over loopback HTTP
        run: python -m scripts.smoke_http

