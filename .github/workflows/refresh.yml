name: Build refresh candidate

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'UTC analysis date YYYY-MM-DD; blank uses current UTC day'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate source checkout first
        run: python -m scripts.check_release
      - name: Acquire and validate in an isolated directory
        env:
          AS_OF: ${{ inputs.as_of }}
        run: python -m scripts.refresh_candidate --output "$RUNNER_TEMP/vice-refresh-candidate"
      - name: Preserve the validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vice-refresh-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/vice-refresh-candidate/
          if-no-files-found: error
          retention-days: 7
