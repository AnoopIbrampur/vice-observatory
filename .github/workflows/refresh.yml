name: Build refresh candidate

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'UTC analysis date YYYY-MM-DD; blank uses current UTC day'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate source checkout first
        run: python -m scripts.check_release
      - name: Acquire and validate in an isolated directory
        env:
          AS_OF: ${{ inputs.as_of }}
        run: python -m scripts.refresh_candidate --output "$RUNNER_TEMP/vice-refresh-candidate"
      - name: Preserve the validated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vice-refresh-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/vice-refresh-candidate/
          if-no-files-found: error
          retention-days: 7
